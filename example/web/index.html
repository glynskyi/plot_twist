<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Replaced by the value of `--base-href` passed to `flutter build web`. The
    published gallery is built with `--base-href /plot_twist/`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <title>plot_twist gallery · composable charts for Flutter</title>
  <meta name="description" content="26 live demos of plot_twist, composable charts for Flutter: pan and zoom a million points, widgets as tooltips and axis labels, lazily loaded history, live data, linked charts and candlesticks.">
  <link rel="canonical" href="https://glynskyi.github.io/plot_twist/">

  <!-- Link previews -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="plot_twist">
  <meta property="og:title" content="plot_twist gallery · composable charts for Flutter">
  <meta property="og:description" content="26 live demos: a million-point line, widgets as tooltips and axis labels, lazily loaded history, live data, linked charts and candlesticks. Every demo is one file under 120 lines.">
  <meta property="og:url" content="https://glynskyi.github.io/plot_twist/">
  <meta property="og:image" content="https://glynskyi.github.io/plot_twist/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A plot_twist chart in the gallery">
  <meta name="twitter:card" content="summary_large_image">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="plot_twist">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <style>
    #loading {
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #3a3a3a;
      max-width: 36rem;
      margin: 18vh auto 0;
      padding: 0 1rem;
      text-align: center;
    }
    #loading h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
    #loading a { color: #3F6FB5; }
    @media (prefers-color-scheme: dark) {
      body { background: #141414; }
      #loading { color: #d6d6d6; }
      #loading a { color: #9db9e8; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <h1>plot_twist gallery</h1>
    <p>Loading 26 live demos of composable charts for Flutter.</p>
    <p>
      <a href="https://github.com/glynskyi/plot_twist">Source on GitHub</a> ·
      <a href="https://pub.dev/packages/plot_twist">plot_twist on pub.dev</a>
    </p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) loading.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
