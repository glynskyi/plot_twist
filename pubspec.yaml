name: plot_twist
description: >-
  Composable charts for Flutter: line, area, bar, pie, gauge, radar, scatter
  and candlestick. Real-time and time series data, large datasets, pan and
  zoom, widgets as tooltips.
version: 0.3.0
homepage: https://glynskyi.github.io/plot_twist/
repository: https://github.com/glynskyi/plot_twist
issue_tracker: https://github.com/glynskyi/plot_twist/issues

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - chart
  - charts
  - visualization
  - graph
  - candlestick

screenshots:
  - description: Candlesticks with volume on a second Y scale; the last candle trades live.
    path: doc/screenshots/a26.png
  - description: A tooltip that is a widget, with an avatar, a small chart and a button.
    path: doc/screenshots/a04.png
  - description: A doughnut with a legend, a gauge and a radar chart of two series.
    path: doc/screenshots/a21.png
  - description: Bars, a line and floating min-max bars in one chart, on two Y axes.
    path: doc/screenshots/a11.png
  - description: A legend above four series that take their colours from the theme's palette.
    path: doc/screenshots/a20.png
  - description: A line of one million points that pans and zooms.
    path: doc/screenshots/a10.png
  - description: A dot where the line crosses the Y axis, with a value pill in the axis gutter.
    path: doc/screenshots/a03.png
  - description: Three linked charts that share one X window and one crosshair.
    path: doc/screenshots/a16.png
  - description: Photo pins that exist only while their data is visible.
    path: doc/screenshots/a06.png
  - description: Axis labels that are widgets, such as icons, two-line text and chips.
    path: doc/screenshots/a07.png
