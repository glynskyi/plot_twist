name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  floor:
    name: Package on Flutter 3.41 (oldest supported)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2
          channel: stable
          cache: true
      # The gallery needs Flutter 3.47 (material_ui), so only the package is resolved here.
      - run: flutter pub get --no-example
      - run: flutter analyze lib test
      - run: flutter test --no-pub

  latest:
    name: Package and gallery on Flutter 3.50
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format (source folders only, at 100 columns)
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test example/test_driver
      - run: flutter analyze
      - run: flutter test
      # The runner's clock is UTC, where the tests of local-time ticks across a
      # clock change skip themselves.
      - name: Time ticks in a zone with daylight saving time
        run: TZ=America/New_York flutter test test/core_test.dart
      - name: Gallery (every demo runs, stays under 120 lines and uses only the public API)
        working-directory: example
        run: flutter test
      - name: Publish dry run
        run: dart pub publish --dry-run
      - name: pub.dev score (fails on any lost point)
        # pana checks the pubspec screenshots with the WebP tools; without them it scores 0/10.
        # The version is pinned so a new pana rule cannot fail an unrelated change.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq webp
          dart pub global activate pana 0.23.19
          dart pub global run pana --exit-code-threshold 0 .

  web:
    name: Gallery builds for the web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      # The same build the Gallery workflow deploys after a merge.
      - name: Build the gallery
        working-directory: example
        run: flutter build web --wasm --release --base-href /plot_twist/
