name: Bug report
description: Something in plot_twist does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Smallest code that shows it
      description: A widget we can paste into a test or the gallery. Fake data is fine.
      render: dart
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: plot_twist version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: flutter
    attributes:
      label: Output of `flutter --version`
      render: text
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms where it happens
      multiple: true
      options: [Android, iOS, Web, macOS, Windows, Linux]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output or screenshots
      render: text
